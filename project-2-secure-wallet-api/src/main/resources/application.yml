spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ledger_db
    username: postgres
    password: yourpassword
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  # Base64 encoded secret key for HMAC-SHA256 (Needs to be at least 256 bits)
  # "my-super-secret-key-that-is-at-least-256-bits-long-for-jwt-signing" base64 encoded:
  secret: bXktc3VwZXItc2VjcmV0LWtleS10aGF0LWlzLWF0LWxlYXN0LTI1Ni1iaXRzLWxvbmctZm9yLWp3dC1zaWduaW5n
  expiration: 86400000
