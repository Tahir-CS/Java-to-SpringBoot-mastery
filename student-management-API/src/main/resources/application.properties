# Common app config used by all profiles.
server.port=8080

# Use test profile by default so this project runs out-of-the-box with H2.
spring.profiles.active=test

# JWT signing secret must be long enough for HS512.
jwt.secret=student-management-api-demo-secret-key-change-this-is-long-enough-for-hs512
jwt.expiration=86400000
