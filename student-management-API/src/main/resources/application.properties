# Common app config used by all profiles.
server.port=8080

# Use test profile by default so this project runs out-of-the-box with H2.
spring.profiles.active=test

# Lesson 3 Iteration 4: demo login credentials for Postman testing.
# In a real app, these values come from a users table or an identity provider.
app.auth.email=ali@example.com
app.auth.password=password123

# JWT signing secret must be long enough for HS512.
jwt.secret=student-management-api-demo-secret-key-change-this-is-long-enough-for-hs512
jwt.expiration=86400000
