# Server runs on the default Spring Boot port.
server.port=8080

# H2 in-memory database for learning.
# Data stays only while the app is running.
spring.datasource.url=jdbc:h2:mem:studentdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate will create the table structure from our @Entity class.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Optional H2 browser console.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
